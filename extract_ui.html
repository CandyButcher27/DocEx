<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document Field Extractor</title>
<style>
  :root { --accent: #4f7cff; --bg: #0f1117; --panel: #171a24; --text: #e6e8ef; --muted: #8a8fa3; }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); padding: 30px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
  .card { background: var(--panel); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=text] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #2a2f3d; background: #10131c; color: var(--text); }
  button { padding: 10px 18px; border-radius: 8px; border: none; background: var(--accent); color: white; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: #2a2f3d; }
  button.small { padding: 4px 10px; font-size: 12px; }
  #fileLabel { display: inline-block; padding: 10px 18px; border-radius: 8px; background: #2a2f3d; cursor: pointer; }
  #fileName { color: var(--muted); font-size: 13px; }
  #fieldList { list-style: none; padding: 0; margin: 12px 0 0 0; display: flex; flex-direction: column; gap: 8px; }
  #fieldList li { display: flex; justify-content: space-between; align-items: center; background: #10131c; padding: 8px 12px; border-radius: 8px; border-left: 3px solid var(--accent); }
  #progress { display: none; margin-top: 10px; }
  .step { display: flex; align-items: center; gap: 10px; padding: 8px 0; color: var(--muted); font-size: 14px; }
  .step.active { color: var(--text); }
  .step.done { color: #4fd18b; }
  .spinner { width: 14px; height: 14px; border: 2px solid #333; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; visibility: hidden; }
  .step.active .spinner { visibility: visible; }
  .check { visibility: hidden; }
  .step.done .check { visibility: visible; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #results table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  #results td, #results th { padding: 10px 12px; border-bottom: 1px solid #2a2f3d; text-align: left; }
  #results th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  #status { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .found { color: #4fd18b; }
  .notfound { color: #e05c5c; }
</style>
</head>
<body>

<h1>Document Field Extractor</h1>

<div class="card">
  <div class="row">
    <label id="fileLabel">
      Choose PDF
      <input type="file" id="pdfInput" accept="application/pdf" style="display:none">
    </label>
    <span id="fileName">No file selected</span>
  </div>
</div>

<div class="card">
  <strong>Fields to extract</strong>
  <div class="row" style="margin-top:10px;">
    <input type="text" id="fieldInput" placeholder="e.g. Policy Number">
    <button id="addFieldBtn">+ Add field</button>
  </div>
  <ul id="fieldList"></ul>
</div>

<div class="card">
  <button id="extractBtn" disabled>Extract</button>
  <button id="downloadBtn" class="secondary" style="display:none;">Download report (CSV)</button>

  <div id="progress">
    <div class="step" id="step-ocr"><span class="spinner"></span><span class="check">&#10003;</span> Extracting text via OCR...</div>
    <div class="step" id="step-llm"><span class="spinner"></span><span class="check">&#10003;</span> Calling VLM for field extraction...</div>
  </div>

  <div id="status"></div>

  <div id="results" style="display:none;">
    <table>
      <thead><tr><th>Field</th><th>Value</th></tr></thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>
</div>

<script>
const pdfInput = document.getElementById('pdfInput');
const fileName = document.getElementById('fileName');
const fieldInput = document.getElementById('fieldInput');
const addFieldBtn = document.getElementById('addFieldBtn');
const fieldList = document.getElementById('fieldList');
const extractBtn = document.getElementById('extractBtn');
const downloadBtn = document.getElementById('downloadBtn');
const progress = document.getElementById('progress');
const status = document.getElementById('status');
const results = document.getElementById('results');
const resultsBody = document.getElementById('resultsBody');

let docId = null;
let fields = [];
let lastResults = {};

function setStatus(msg) { status.textContent = msg; }

function renderFieldList() {
  fieldList.innerHTML = '';
  fields.forEach((f, i) => {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = f;
    const del = document.createElement('button');
    del.textContent = 'x';
    del.className = 'small secondary';
    del.onclick = () => { fields.splice(i, 1); renderFieldList(); updateExtractBtn(); };
    li.appendChild(span);
    li.appendChild(del);
    fieldList.appendChild(li);
  });
}

function updateExtractBtn() {
  extractBtn.disabled = !(docId && fields.length > 0);
}

addFieldBtn.addEventListener('click', () => {
  const name = fieldInput.value.trim();
  if (!name) return;
  fields.push(name);
  fieldInput.value = '';
  renderFieldList();
  updateExtractBtn();
});

fieldInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') addFieldBtn.click();
});

pdfInput.addEventListener('change', async () => {
  const file = pdfInput.files[0];
  if (!file) return;
  fileName.textContent = file.name;
  setStatus('Uploading...');
  const formData = new FormData();
  formData.append('pdf', file);
  const res = await fetch('/upload', { method: 'POST', body: formData });
  const data = await res.json();
  docId = data.doc_id;
  setStatus('Uploaded: ' + data.filename);
  updateExtractBtn();
});

function setStep(id, state) {
  const el = document.getElementById(id);
  el.classList.remove('active', 'done');
  if (state) el.classList.add(state);
}

extractBtn.addEventListener('click', async () => {
  extractBtn.disabled = true;
  downloadBtn.style.display = 'none';
  results.style.display = 'none';
  progress.style.display = 'block';
  setStep('step-ocr', 'active');
  setStep('step-llm', null);
  setStatus('');

  try {
    const ocrRes = await fetch('/run_ocr', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc_id: docId }),
    });
    const ocrData = await ocrRes.json();
    if (ocrData.error) throw new Error(ocrData.error);
    setStep('step-ocr', 'done');
    setStep('step-llm', 'active');

    const llmRes = await fetch('/run_llm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc_id: docId, fields: fields }),
    });
    const llmData = await llmRes.json();
    if (llmData.error) throw new Error(llmData.error);
    setStep('step-llm', 'done');

    lastResults = llmData.results;
    resultsBody.innerHTML = '';
    fields.forEach(f => {
      const val = lastResults[f] ?? 'NOT_FOUND';
      const tr = document.createElement('tr');
      const tdField = document.createElement('td');
      tdField.textContent = f;
      const tdVal = document.createElement('td');
      tdVal.textContent = val;
      tdVal.className = val === 'NOT_FOUND' ? 'notfound' : 'found';
      tr.appendChild(tdField);
      tr.appendChild(tdVal);
      resultsBody.appendChild(tr);
    });
    results.style.display = 'block';
    downloadBtn.style.display = 'inline-block';
  } catch (err) {
    setStatus('Error: ' + err.message);
  } finally {
    extractBtn.disabled = false;
  }
});

downloadBtn.addEventListener('click', () => {
  const lines = ['field,value'];
  fields.forEach(f => {
    const val = (lastResults[f] ?? 'NOT_FOUND').replace(/"/g, '""');
    lines.push(`"${f}","${val}"`);
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'extraction_report.csv';
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
